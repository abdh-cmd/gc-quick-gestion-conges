<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
 <rect width="1600" height="1000" fill="white"/>
 <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1f2937"/></marker></defs>
 <style>
 .title{font:bold 42px Arial,sans-serif;fill:#14213d}.sub{font:21px Arial,sans-serif;fill:#52606d}.node{fill:#fff;stroke:#334155;stroke-width:3}.head{fill:#e9eef5;stroke:#334155;stroke-width:3}.boxTitle{font:bold 26px Arial,sans-serif;fill:#111827}.text{font:21px Arial,sans-serif;fill:#111827}.small{font:19px Arial,sans-serif;fill:#334155}.line{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}.label{font:20px Arial,sans-serif;fill:#111827}
 </style>
 <text x="800" y="65" text-anchor="middle" class="title">Diagramme de deploiement - GQ</text>
 <text x="800" y="100" text-anchor="middle" class="sub">Environnement de developpement local</text>
 
 <!-- user -->
 <circle cx="130" cy="315" r="24" fill="none" stroke="#111827" stroke-width="3"/><line x1="130" y1="339" x2="130" y2="425" stroke="#111827" stroke-width="3"/><line x1="82" y1="365" x2="178" y2="365" stroke="#111827" stroke-width="3"/><line x1="130" y1="425" x2="90" y2="475" stroke="#111827" stroke-width="3"/><line x1="130" y1="425" x2="170" y2="475" stroke="#111827" stroke-width="3"/><text x="130" y="515" text-anchor="middle" class="boxTitle">Utilisateur</text>
 
 <!-- browser -->
 <rect x="300" y="230" width="350" height="260" rx="6" class="node"/><rect x="300" y="230" width="350" height="60" class="head"/><text x="475" y="269" text-anchor="middle" class="boxTitle">Navigateur web</text><text x="475" y="350" text-anchor="middle" class="boxTitle">Chrome / Edge</text><text x="475" y="390" text-anchor="middle" class="text">Interface GQ</text><text x="475" y="430" text-anchor="middle" class="small">Client Angular dans le navigateur</text>
 <path d="M190 365 L280 365" class="line"/><text x="230" y="340" text-anchor="middle" class="label">utilisation</text>
 
 <!-- local front -->
 <rect x="820" y="190" width="330" height="300" rx="6" class="node"/><rect x="820" y="190" width="330" height="60" class="head"/><text x="985" y="229" text-anchor="middle" class="boxTitle">Serveur front local</text><text x="985" y="325" text-anchor="middle" class="boxTitle">Angular 21</text><text x="985" y="365" text-anchor="middle" class="text">ng serve - port 4200</text><text x="985" y="405" text-anchor="middle" class="small">Application frontend</text>
 <path d="M670 365 L800 365" class="line"/><text x="735" y="340" text-anchor="middle" class="label">HTTP</text>
 
 <!-- api -->
 <rect x="820" y="610" width="330" height="280" rx="6" class="node"/><rect x="820" y="610" width="330" height="60" class="head"/><text x="985" y="649" text-anchor="middle" class="boxTitle">Serveur API local</text><text x="985" y="735" text-anchor="middle" class="boxTitle">NestJS 11 / Node.js</text><text x="985" y="775" text-anchor="middle" class="text">API REST - port 3000</text><text x="985" y="815" text-anchor="middle" class="small">JWT - bcrypt - TypeORM</text>
 <path d="M985 510 L985 590" class="line"/><text x="1050" y="555" class="label">HTTP / JSON</text>
 
 <!-- database -->
 <rect x="1260" y="610" width="280" height="280" rx="6" class="node"/><rect x="1260" y="610" width="280" height="60" class="head"/><text x="1400" y="649" text-anchor="middle" class="boxTitle">Base de donnees</text><text x="1400" y="735" text-anchor="middle" class="boxTitle">MariaDB / MySQL</text><text x="1400" y="775" text-anchor="middle" class="text">XAMPP - port 3306</text><text x="1400" y="815" text-anchor="middle" class="small">Base : tempolis</text>
 <path d="M1170 750 L1240 750" class="line"/><text x="1205" y="725" text-anchor="middle" class="label">TypeORM / SQL</text>
 <line x1="85" y1="940" x2="1515" y2="940" stroke="#cbd5e1" stroke-width="2"/><text x="800" y="975" text-anchor="middle" class="sub">Le navigateur utilise Angular ; Angular appelle l'API NestJS ; seule l'API accede a MySQL.</text>
</svg>
